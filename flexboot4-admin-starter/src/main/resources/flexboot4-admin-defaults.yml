# Flexboot4 Admin Starter 默认配置
# 本文件提供框架级别的默认配置，外部项目无需重复定义

spring:
  jackson:
    time-zone: Asia/Shanghai
    # 让 Jackson 在序列化为 JSON 时，自动忽略值为 null 的字段，比如字段 publishTime 如果没有值就不会出现在返回的 JSON 中
    # non_null-不返回null的字段  always-返回所有字段（默认）  non_absent-不返回null和Optional.empty的字段  non_default-不返回值为默认值的字段
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
security:
  ignore:
    urls:
      - /resources/**
      - /static/**
      - /api/admin/auth/options
      - /api/admin/auth/login
      - /api/admin/auth/mfa/verify
      - /api/admin/auth/sms-code
      - /api/admin/auth/forget-password
      - /api/admin/auth/reset-password
      - /api/admin/file/access/**
      - /v3/api-docs/**
      - /scalar/**
      - /error

flexboot4:
  flyway:
    enabled: ${FLEXBOOT4_FLYWAY_ENABLED:true}
    database: ${FLEXBOOT4_FLYWAY_DATABASE:postgresql}
    auto-detect-modules: ${FLEXBOOT4_FLYWAY_AUTO_DETECT_MODULES:true}
  lock:
    key-prefix: ${FLEXBOOT4_LOCK_KEY_PREFIX:flexboot4:lock:}
    default-ttl-millis: ${FLEXBOOT4_LOCK_DEFAULT_TTL_MILLIS:60000}
  file-storage:
    type: ${FLEXBOOT4_FILE_STORAGE_TYPE:local}
    access-token-secret: ${FLEXBOOT4_FILE_ACCESS_TOKEN_SECRET:${jwt.secret:thisIsASecretKeyThatIsLongEnoughForHmacSha256SecurityRequirement}}
    access-url-path: ${FLEXBOOT4_FILE_ACCESS_URL_PATH:/api/admin/file/access}
    local:
      root-dir: ${FLEXBOOT4_LOCAL_STORAGE_ROOT:${user.home}/flexboot4-files}
      bucket: ${FLEXBOOT4_LOCAL_STORAGE_BUCKET:local}
  mail:
    enabled: ${FLEXBOOT4_MAIL_ENABLED:false}
  security:
    mfa-secret-key: ${FLEXBOOT4_SECURITY_MFA_SECRET_KEY:${jwt.secret:thisIsASecretKeyThatIsLongEnoughForHmacSha256SecurityRequirement}}
  schedule:
    enabled: ${FLEXBOOT4_SCHEDULE_ENABLED:false}

operlog:
  stream:
    enabled: ${OPERLOG_STREAM_ENABLED:false}
    key: ${OPERLOG_STREAM_KEY:operlog:stream}
    group: ${OPERLOG_STREAM_GROUP:operlog-group}
    consumer: ${OPERLOG_STREAM_CONSUMER:${spring.application.name}-1}
    dead-letter-key: ${OPERLOG_STREAM_DEAD_LETTER_KEY:operlog:stream:dead}
    reclaim-batch-size: ${OPERLOG_STREAM_RECLAIM_BATCH_SIZE:50}
    reclaim-min-idle-millis: ${OPERLOG_STREAM_RECLAIM_MIN_IDLE_MILLIS:60000}
    max-delivery-attempts: ${OPERLOG_STREAM_MAX_DELIVERY_ATTEMPTS:10}

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  path: /scalar

# MyBatis-Flex 标准配置
# 外部项目只需配置数据源连接信息 (url、username、password)
# 其他通用配置已在此默认定义，无需重复配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  inject-sql-session-on-mapper-scan: true
  global-config:
    print-banner: false
